<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페널티킥 슈팅 게임 (Penalty Kick Game)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 550px;
            background: linear-gradient(to bottom, #74b9ff 0%, #a1c4fd 40%, #55efc4 40%, #2ed573 100%);
            border-radius: 16px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
            overflow: hidden;
            border: 4px solid #fff;
        }

        /* Stadium Details */
        .stadium-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(to bottom, #2c3e50, #3498db);
        }
        .crowd {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: repeating-linear-gradient(
                90deg,
                #e74c3c, #e74c3c 10px,
                #f1c40f 10px, #f1c40f 20px,
                #9b59b6 20px, #9b59b6 30px,
                #3498db 30px, #3498db 40px
            );
            opacity: 0.6;
        }

        /* Pitch Grass Stripes */
        .pitch {
            position: absolute;
            top: 40%;
            width: 100%;
            height: 60%;
            background: repeating-linear-gradient(
                0deg,
                #2ed573,
                #2ed573 30px,
                #26af5f 30px,
                #26af5f 60px
            );
        }

        /* Penalty Area Lines */
        .penalty-line {
            position: absolute;
            border: 4px solid rgba(255, 255, 255, 0.7);
        }
        .penalty-box {
            top: 40%;
            left: 15%;
            width: 70%;
            height: 45%;
            border-top: none;
        }
        .goal-box {
            top: 40%;
            left: 30%;
            width: 40%;
            height: 20%;
            border-top: none;
        }
        .penalty-spot {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 12px;
            background: white;
            border-radius: 50%;
        }

        /* Goal Post */
        .goal-frame {
            position: absolute;
            top: 130px;
            left: 50%;
            transform: translateX(-50%);
            width: 360px;
            height: 140px;
            border: 10px solid #ffffff;
            border-bottom: none;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.2);
            z-index: 2;
        }
        .net {
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.4) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.4) 1px, transparent 1px);
            background-size: 12px 12px;
            background-color: rgba(255,255,255,0.1);
        }

        /* Goalkeeper */
        #goalkeeper {
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 70px;
            z-index: 3;
            transition: all 0.4s ease-out;
        }
        .keeper-body {
            position: absolute;
            bottom: 0;
            left: 10px;
            width: 30px;
            height: 45px;
            background: #ff4757;
            border-radius: 8px;
        }
        .keeper-head {
            position: absolute;
            top: 5px;
            left: 15px;
            width: 20px;
            height: 20px;
            background: #ff7979;
            border-radius: 50%;
        }
        .keeper-arm-l, .keeper-arm-r {
            position: absolute;
            top: 28px;
            width: 14px;
            height: 8px;
            background: #ff4757;
            border-radius: 4px;
        }
        .keeper-arm-l { left: -2px; }
        .keeper-arm-r { right: -2px; }

        /* Target Reticle (Aim) */
        #target {
            position: absolute;
            top: 200px;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            border: 3px dashed #fffa65;
            border-radius: 50%;
            z-index: 4;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px #fffa65;
        }
        #target::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #fffa65;
            border-radius: 50%;
        }

        /* Soccer Ball */
        #ball {
            position: absolute;
            bottom: 95px;
            left: 50%;
            transform: translateX(-50%);
            width: 42px;
            height: 42px;
            background: radial-gradient(circle at 30% 30%, #ffffff, #dcdde1);
            border-radius: 50%;
            z-index: 5;
            box-shadow: 0 10px 15px rgba(0,0,0,0.4);
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), top 0.6s cubic-bezier(0.25, 1, 0.5, 1), left 0.6s cubic-bezier(0.25, 1, 0.5, 1), width 0.6s, height 0.6s;
        }
        /* Ball Pattern */
        #ball::before {
            content: '⚽';
            font-size: 42px;
            position: absolute;
            top: -5px;
            left: 0px;
            line-height: 42px;
        }

        /* Power Meter */
        .power-meter-container {
            position: absolute;
            right: 30px;
            bottom: 40px;
            width: 24px;
            height: 180px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column-reverse;
            z-index: 10;
        }
        #power-bar {
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #2ed573, #ffa502, #ff4757);
            transition: height 0.05s linear;
        }
        .power-label {
            position: absolute;
            right: 22px;
            bottom: 225px;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            text-shadow: 1px 1px 3px #000;
        }

        /* Score & UI */
        .ui-header {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
        }
        .score-board, .attempts-board {
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
        }

        /* Messages Overlays */
        #message {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            text-shadow: 3px 3px 10px rgba(0,0,0,0.8);
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .msg-goal { color: #2ed573; text-shadow: 0 0 20px #2ed573; }
        .msg-saved { color: #ff4757; text-shadow: 0 0 20px #ff4757; }
        .msg-miss { color: #ffa502; text-shadow: 0 0 20px #ffa502; }

        /* Controls / Instructions */
        .instructions {
            margin-top: 15px;
            color: #ccc;
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
        }
        .btn-reset {
            margin-top: 15px;
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #2ed573;
            color: #fff;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(46, 213, 115, 0.4);
            transition: all 0.2s;
        }
        .btn-reset:hover {
            background: #26af5f;
            transform: translateY(-2px);
        }

        .controls-hint {
            position: absolute;
            bottom: 15px;
            left: 30px;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-radius: 10px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <h1 style="margin-bottom: 15px; font-size: 28px;">⚽ 페널티 킥 슈팅 게임 ⚽</h1>

    <div id="game-container">
        <!-- Stadium Background -->
        <div class="stadium-bg">
            <div class="crowd"></div>
        </div>
        <div class="pitch"></div>
        <div class="penalty-line penalty-box"></div>
        <div class="penalty-line goal-box"></div>
        <div class="penalty-spot"></div>

        <!-- Goal Post -->
        <div class="goal-frame">
            <div class="net"></div>
        </div>

        <!-- Goalkeeper -->
        <div id="goalkeeper">
            <div class="keeper-head"></div>
            <div class="keeper-body"></div>
            <div class="keeper-arm-l"></div>
            <div class="keeper-arm-r"></div>
        </div>

        <!-- Target Reticle -->
        <div id="target"></div>

        <!-- Soccer Ball -->
        <div id="ball"></div>

        <!-- Power Meter -->
        <div class="power-label">파워 (Space)</div>
        <div class="power-meter-container">
            <div id="power-bar"></div>
        </div>

        <!-- Scoreboard UI -->
        <div class="ui-header">
            <div class="score-board">득점: <span id="score">0</span></div>
            <div class="attempts-board">시도: <span id="attempts">0</span> / 5</div>
        </div>

        <!-- Feedback Message -->
        <div id="message">GOAL!</div>

        <div class="controls-hint">
            🎯 조준: 방향키 (← → ↑ ↓) | 🚀 슈팅: 스페이스바 (Space)
        </div>
    </div>

    <button class="btn-reset" onclick="resetGame()">게임 다시 시작</button>

    <div class="instructions">
        <p>1. <b>방향키 (← → ↑ ↓)</b>를 눌러 공을 찰 위치(조준점)를 정하세요.</p>
        <p>2. <b>스페이스바(Space)</b>를 길게 눌러 슛 파워를 조절한 후 떼면 슛을 쏩니다.</p>
        <p>3. 골키퍼의 수비를 피해 5번의 기회 동안 최대한 많은 골을 성공시키세요!</p>
    </div>

    <script>
        // Game State Variables
        let score = 0;
        let attempts = 0;
        const maxAttempts = 5;
        let isShooting = false;
        let isPowerCharging = false;
        let power = 0;
        let powerInterval = null;
        let powerDirection = 1;

        // Target Position
        let targetX = 400; // Center X
        let targetY = 190; // Center Y

        const minTargetX = 180;
        const maxTargetX = 620;
        const minTargetY = 120;
        const maxTargetY = 280;

        // Elements
        const targetEl = document.getElementById('target');
        const ballEl = document.getElementById('ball');
        const keeperEl = document.getElementById('goalkeeper');
        const powerBar = document.getElementById('power-bar');
        const scoreEl = document.getElementById('score');
        const attemptsEl = document.getElementById('attempts');
        const messageEl = document.getElementById('message');

        // Key Press Controls
        const keys = {};

        document.addEventListener('keydown', (e) => {
            if (isShooting) return;

            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }

            keys[e.key] = true;

            // Start Power Charging
            if (e.key === ' ' && !isPowerCharging && attempts < maxAttempts) {
                startPowerMeter();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
                keys[e.key] = false;
            }

            // Execute Shoot
            if (e.key === ' ' && isPowerCharging) {
                stopPowerMeterAndShoot();
            }
        });

        // Target Movement Loop
        function updateTargetPosition() {
            if (!isShooting && attempts < maxAttempts) {
                const speed = 4;
                if (keys['ArrowLeft'] && targetX > minTargetX) targetX -= speed;
                if (keys['ArrowRight'] && targetX < maxTargetX) targetX += speed;
                if (keys['ArrowUp'] && targetY > minTargetY) targetY -= speed;
                if (keys['ArrowDown'] && targetY < maxTargetY) targetY += speed;

                targetEl.style.left = targetX + 'px';
                targetEl.style.top = targetY + 'px';
            }
            requestAnimationFrame(updateTargetPosition);
        }
        updateTargetPosition();

        // Power Meter Functions
        function startPowerMeter() {
            isPowerCharging = true;
            power = 0;
            powerDirection = 1;
            powerBar.style.height = '0%';

            powerInterval = setInterval(() => {
                power += 3 * powerDirection;
                if (power >= 100) {
                    power = 100;
                    powerDirection = -1;
                } else if (power <= 0) {
                    power = 0;
                    powerDirection = 1;
                }
                powerBar.style.height = power + '%';
            }, 20);
        }

        function stopPowerMeterAndShoot() {
            clearInterval(powerInterval);
            isPowerCharging = false;
            isShooting = true;
            shootBall();
        }

        // Shoot Logic
        function shootBall() {
            attempts++;
            attemptsEl.innerText = attempts;

            // 1. Determine Keeper Dive Target
            const keeperPossibleX = [220, 310, 400, 490, 580];
            const keeperTargetX = keeperPossibleX[Math.floor(Math.random() * keeperPossibleX.length)];
            const keeperTargetY = 170 + (Math.random() * 60);

            // Move Goalkeeper
            keeperEl.style.left = keeperTargetX + 'px';
            keeperEl.style.top = keeperTargetY + 'px';
            
            if (keeperTargetX < 350) {
                keeperEl.style.transform = 'translateX(-50%) rotate(-45deg)';
            } else if (keeperTargetX > 450) {
                keeperEl.style.transform = 'translateX(-50%) rotate(45deg)';
            } else {
                keeperEl.style.transform = 'translateX(-50%) rotate(0deg)';
            }

            // 2. Calculate Actual Ball Destination
            let finalX = targetX;
            let finalY = targetY;

            if (power > 90) {
                finalY -= 40; // High Over
            } else if (power < 20) {
                finalY += 30; // Weak shot
            }

            // Move Ball
            ballEl.style.left = finalX + 'px';
            ballEl.style.top = finalY + 'px';
            ballEl.style.width = '24px';
            ballEl.style.height = '24px';
            ballEl.style.transform = 'translateX(-50%) scale(0.6)';

            // 3. Check Result
            setTimeout(() => {
                checkResult(finalX, finalY, keeperTargetX, keeperTargetY);
            }, 600);
        }

        function checkResult(ballX, ballY, keeperX, keeperY) {
            const inGoalX = ballX >= 235 && ballX <= 565;
            const inGoalY = ballY >= 135 && ballY <= 265;

            const dist = Math.hypot(ballX - keeperX, ballY - keeperY);
            const isSaved = dist < 65;

            if (!inGoalX || !inGoalY) {
                showMessage('MISS!', 'msg-miss');
            } else if (isSaved) {
                showMessage('SAVED!', 'msg-saved');
            } else {
                score++;
                scoreEl.innerText = score;
                showMessage('GOAL!!', 'msg-goal');
            }

            setTimeout(() => {
                resetShot();
            }, 1800);
        }

        function showMessage(text, className) {
            messageEl.innerText = text;
            messageEl.className = 'show ' + className;
        }

        function resetShot() {
            messageEl.className = '';
            
            // Reset Ball
            ballEl.style.transition = 'none';
            ballEl.style.left = '50%';
            ballEl.style.top = '';
            ballEl.style.bottom = '95px';
            ballEl.style.width = '42px';
            ballEl.style.height = '42px';
            ballEl.style.transform = 'translateX(-50%)';

            // Reset Keeper
            keeperEl.style.left = '50%';
            keeperEl.style.top = '200px';
            keeperEl.style.transform = 'translateX(-50%) rotate(0deg)';

            ballEl.offsetHeight;
            ballEl.style.transition = 'transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), top 0.6s cubic-bezier(0.25, 1, 0.5, 1), left 0.6s cubic-bezier(0.25, 1, 0.5, 1), width 0.6s, height 0.6s';

            powerBar.style.height = '0%';

            if (attempts >= maxAttempts) {
                setTimeout(() => {
                    alert(`게임 종료! 최종 점수: ${score} / ${maxAttempts} 골`);
                }, 300);
            } else {
                isShooting = false;
            }
        }

        function resetGame() {
            score = 0;
            attempts = 0;
            isShooting = false;
            scoreEl.innerText = 0;
            attemptsEl.innerText = 0;
            targetX = 400;
            targetY = 190;
            targetEl.style.left = targetX + 'px';
            targetEl.style.top = targetY + 'px';
            resetShot();
        }
    </script>
</body>
</html>
